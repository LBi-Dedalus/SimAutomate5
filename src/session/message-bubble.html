<!-- A sent or received message. Text slots: title, time, ack. Handles (classes): msg-title, msg-ack (removed when the
     message has no acknowledgement), bub (rendered by the code, as it holds control chips). -->
<div class="msg" data-action="click:msg.choose keydown:msg.key">
  <div>
    <span class="badge msg-title" data-slot="title"></span>
    <span data-slot="time"></span>
    <span class="msg-ack" data-slot="ack"></span>
  </div>
  <div class="bub"></div>
</div>
