<!-- A parsed HL7 segment. Text slots: arrow, name, description (removed when unknown). Handle: head. The fields are added by the code. -->
<div class="seg-block">
  <button type="button" class="sgh" data-slot="head" data-action="click:insp.toggleSegment">
    <span class="ar" data-slot="arrow"></span>
    <span class="nm" data-slot="name"></span>
    <em data-slot="description"></em>
  </button>
</div>
