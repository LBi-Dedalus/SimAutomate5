<!-- A parsed HL7 segment. Text slots: arrow, name, description. Handles (classes): sgh, sg-arrow, sg-desc (removed when unknown). The fields are added by the code. -->
<div class="seg-block">
  <button type="button" class="sgh" data-action="click:insp.toggleSegment">
    <span class="sg-arrow" data-slot="arrow"></span>
    <span class="nm" data-slot="name"></span>
    <em class="sg-desc" data-slot="description"></em>
  </button>
</div>
