<!-- One entry of an ASTM transfer (ENQ, frame or EOT). Handles (classes): af (gets "warn" when the frame is not
     acknowledged), af-text (the raw content, filled by the code with control-character chips), af-side (the checksum
     badge and the answer hint are appended by the code). -->
<div class="af">
  <span class="af-text"></span>
  <span class="hstack gap-1 af-side"></span>
</div>
