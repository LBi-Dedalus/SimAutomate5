<link rel="x-template" href="session/system-message.html" />
<link rel="x-template" href="session/message-bubble.html" />
<link rel="x-template" href="session/session-item.html" />
<link rel="x-template" href="session/inspector-tab.html" />
<link rel="x-template" href="session/segment-block.html" />
<link rel="x-template" href="session/astm-badge.html" />
<link rel="x-template" href="session/astm-frame.html" />
<script type="after-include" src="session/sessions.js"></script>
<script type="after-include" src="session/messages.js"></script>
<script type="after-include" src="session/session-ui.js"></script>
<script type="after-include" src="session/special-chars.js"></script>
<header>
  <h4>
    <span id="session-title">No connection</span>
    <span id="session-mode" class="badge hidden"></span>
    <small id="session-address" class="hidden"></small>
  </h4>
  <span class="badge mute" data-status-pill><i></i>Disconnected</span>
  <div class="sp"></div>
  <button class="small ghost" type="button" id="clear-chat" data-action="click:msg.clear">Clear</button>
  <button class="small outline" type="button" id="session-reconnect" data-action="click:sess.reconnect">Reconnect</button>
  <button class="small outline hidden" data-variant="danger" type="button" id="session-disconnect" data-action="click:sess.disconnect">Disconnect</button>
  <button class="small ghost" type="button"   id="session-rename" data-action="click:sess.rename">Rename</button>
    <button class="small ghost" type="button" id="session-close" data-action="click:sess.close">Close</button>
</header>

<div class="split">
  <div class="convo">
    <div id="messages">
      <div id="no-connection" class="empty">
        <i aria-hidden="true">◉</i>
        <b class="es-off">No connection</b>
        <button type="button" class="small outline es-off" data-nav="home" data-action="click:nav.go">Go to Home</button>
        <b class="es-on">No message yet</b>
      </div>
    </div>

    <form id="message-form" class="card" data-action="input:msg.capture change:msg.capture reset:msg.reset submit:msg.submit">
      <div id="special-chars" aria-label="Send a control character">
        <span>Send</span>
        <button type="button" class="chip" data-action="click:chars.send" data-token="ENQ" aria-label="Send &lt;ENQ&gt;" disabled>ENQ</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="EOT" aria-label="Send &lt;EOT&gt;" disabled>EOT</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="ACK" aria-label="Send &lt;ACK&gt;" disabled>ACK</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="NAK" aria-label="Send &lt;NAK&gt;" disabled>NAK</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="VT" aria-label="Send &lt;VT&gt;" disabled>VT</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="FS.CR" aria-label="Send &lt;FS&gt;&lt;CR&gt;" disabled>FS·CR</button>
        <button type="button" class="chip" data-action="click:chars.send" data-token="CR" aria-label="Send &lt;CR&gt;" disabled>CR</button>
      </div>
      <textarea type="text" placeholder="Type a message…" required name="message" spellcheck="false"></textarea>
      <div>
        <button class="small ghost" type="reset">Clear</button>
        <button class="small outline" type="button" data-action="click:msg.autobuild" id="composer-autobuild" aria-label="Autobuild the message above (replaces it)">⚒ Autobuild</button>
        <button disabled type="submit">Send ➤</button>
      </div>
    </form>
  </div>

  <aside id="inspector" class="drawer" aria-label="Message inspector">
    <header>
      <div class="hstack gap-2">
        <span id="insp-dir" class="badge hidden"></span>
        <b id="insp-title">Message inspector</b>
      </div>
      <small id="insp-meta" class="hstack gap-2"></small>
      <button type="button" class="small ghost icon drawer-close" id="insp-close" aria-label="Close inspector" data-action="click:insp.close">✕</button>
      <div id="insp-tabs" role="tablist"></div>
    </header>
    <div id="insp-body">
      <p>Select a message in the conversation to inspect it.</p>
    </div>
    <footer>
          <span class="sp"></span>
          <button type="button" class="small outline" id="insp-copy" data-action="click:insp.copy" disabled>Copy</button>
      <button type="button" class="small outline" id="insp-save-template" data-action="click:insp.saveTemplate" disabled>Save as template</button>
    </footer>
  </aside>
</div>
