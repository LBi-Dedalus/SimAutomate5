<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimAutomate5</title>
    <link rel="stylesheet" href="./oat.min.css" />
    <script src="./oat.min.js" defer></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./home/home.css" />
    <link rel="stylesheet" href="./session/session.css" />
    <link rel="stylesheet" href="./templates/templates.css" />
    <link rel="stylesheet" href="./autoreply/autoreply.css" />
    <link rel="stylesheet" href="./autobuild/autobuild.css" />
    <!-- include.js loads the data-include markup, then imports every <script type="after-include"> of
         the page and of the included views, in document order (they are inert for the browser until
         then). The common scripts are listed here, the view scripts in their <view>.html. config.js
         must stay first: it hydrates the persisted fields before the other modules read them. -->
    <script type="module" src="./include.js"></script>
    <script type="after-include" src="config.js"></script>
    <script type="after-include" src="status.js"></script>
    <script type="after-include" src="nav.js"></script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1><img src="assets/logo.png" alt="" width="24" height="24" aria-hidden="true" />SimAutomate</h1>

        <nav id="nav" aria-label="Main">
          <button type="button" class="on" data-view="home"><b aria-hidden="true">⌂</b>Home</button>
          <button type="button" data-view="session"><b aria-hidden="true">◉</b>Session</button>
          <button type="button" data-view="templates"><b aria-hidden="true">▤</b>Templates</button>
          <button type="button" data-view="autoreply">
            <b aria-hidden="true">↺</b>Auto reply
            <span id="autoreply-badge" class="badge hidden">ON</span>
          </button>
          <button type="button" data-view="autobuild"><b aria-hidden="true">⚒</b>Autobuild</button>
        </nav>

        <div id="side-lists">
          <h6>
            <span>Sessions</span>
            <button type="button" id="session-new" class="ghost icon" title="New session (go to Home)" aria-label="New session">＋</button>
          </h6>
          <div id="side-sessions"></div>
          <p id="side-sessions-empty">No session open</p>
          <p id="sessions-note" class="hidden" role="status"></p>

          <h6><span>Recent servers</span></h6>
          <div id="side-recent"></div>
          <p id="side-recent-empty">None yet</p>
        </div>

        <footer>
          <span class="badge mute" id="status" data-status-pill><i></i>Disconnected</span>
          <span id="side-endpoint"></span>
        </footer>
      </aside>

      <div id="views">
        <!-- ───────────── Home ───────────── -->
        <section id="view-home" class="view" data-view-panel="home" data-include="home/home.html"></section>

        <!-- ───────────── Session ───────────── -->
        <section id="view-session" class="view hidden" data-view-panel="session" data-include="session/session.html"></section>

        <!-- ───────────── Templates ───────────── -->
        <section id="view-templates" class="view hidden" data-view-panel="templates" data-include="templates/templates.html"></section>

        <!-- ───────────── Auto reply ───────────── -->
        <section id="view-autoreply" class="view hidden" data-view-panel="autoreply" data-include="autoreply/autoreply.html"></section>

        <!-- Autobuild -->
        <section id="view-autobuild" class="view hidden" data-view-panel="autobuild" data-include="autobuild/autobuild.html"></section>
      </div>
    </div>

    <dialog id="close-confirm" closedby="any" data-include="session/close-confirm.html"></dialog>
  </body>
</html>
