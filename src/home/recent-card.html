<!-- One recent endpoint on Home. Slots: kind (also the badge handle), verb, name (the title: the custom name, else the address). The wrapper draws the card frame; the rename and copy buttons form a footer strip, siblings of the card button because a button cannot nest another. -->
<div class="card-wrap">
  <button type="button" class="card" data-action="click:home.useRecent">
    <div>
      <span class="badge" data-slot="kind"></span>
      <small class="go">
        <span class="verb" data-slot="verb"></span>
        <span>↗</span>
      </small>
    </div>
    <b class="card-name" data-slot="name"></b>
  </button>
  <div class="card-actions">
    <button type="button" class="ghost card-rename" data-action="click:home.renameRecent">Rename</button>
    <button type="button" class="ghost card-copy" data-action="click:home.copyRecent">Copy</button>
  </div>
</div>
