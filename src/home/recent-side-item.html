<!-- One recent endpoint in the sidebar. Slots: endpoint (the name, else the address), detail. Handles: ses (connect button), ses-rename. -->
<div class="ses-item">
  <button type="button" class="ses" data-action="click:home.useRecent">
    <i></i>
    <span>
      <span data-slot="endpoint"></span>
      <small data-slot="detail"></small>
    </span>
    <b>↗</b>
  </button>
  <div class="ses-actions">
    <button type="button" class="ghost ses-rename" data-action="click:home.renameRecent">✎</button>
  </div>
</div>
