<!-- One template of the list. Text slots: name (also the nm-t handle). Handles (classes): t-kind (class and text set by the code),
     t-dirty (removed unless the open template has unsaved changes), k-x (delete; removed unless open). -->
<div class="card tcard">
  <button type="button" class="tload" data-action="click:tpl.open">
    <b>
      <span class="nm"><span class="nm-t" data-slot="name"></span><span class="t-kind"></span></span>
      <span class="t-dirty">●</span>
    </b>
    <div class="mt"></div>
  </button>
  <button type="button" class="k-x" data-action="click:tpl.remove">✕</button>
</div>
