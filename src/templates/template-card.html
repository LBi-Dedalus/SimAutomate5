<!-- One template of the list. Text slots: name. Handles: kind (class and text set by the code),
     dirty (removed unless the open template has unsaved changes), delete (removed unless open). -->
<div class="card tcard">
  <button type="button" class="tload" data-slot="load">
    <b>
      <span class="nm"><span class="nm-t" data-slot="name"></span><span data-slot="kind"></span></span>
      <span data-slot="dirty">●</span>
    </b>
    <div class="mt"></div>
  </button>
  <button type="button" class="k-x" data-slot="delete">✕</button>
</div>
